vars:
  name: $(basename $(realpath -s .))
  build:
    path: ./cmd/pulse
    goarch: [amd64]

tasks:
  default:
    passthru: true
    steps:
      - task: fmt
      - task: test:gotestsum

  migrate: ../.atkins/schema-migrate.yml

  fmt:
    cmds:
      - splint fix ./...

  test:
    depends_on: migrate
    cmds:
      - task: test:gotestsum

  test:gotestsum:
    passthru: true
    tty: true
    env:
      vars:
        PLATFORM_DB_USER: sqlite://file:user.test.db
    cmds:
      - gotestsum -- -tags integration ./...
